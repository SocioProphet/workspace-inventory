name: inventory

# Observable CI probe: canonical repo estate export

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "inventory/**"
      - "exports/**"
      - "tools/validate_inventory.py"
      - "tools/check_canonical_repo_export.py"
      - ".github/workflows/inventory.yml"
  push:
    branches: [main]
    paths:
      - "inventory/**"
      - "exports/**"
      - "tools/validate_inventory.py"
      - "tools/check_canonical_repo_export.py"
      - ".github/workflows/inventory.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install validation dependencies
        run: python3 -m pip install pyyaml
      - name: Validate inventory structure
        run: python3 tools/validate_inventory.py
      - name: Check canonical repo estate export
        run: python3 tools/check_canonical_repo_export.py
