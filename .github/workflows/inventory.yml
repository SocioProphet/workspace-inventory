name: inventory

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "inventory/**"
      - "exports/**"
      - "tools/validate_inventory.py"
      - "tools/check_canonical_repo_export.py"
      - ".github/workflows/inventory.yml"
  push:
    branches: [main]
    paths:
      - "inventory/**"
      - "exports/**"
      - "tools/validate_inventory.py"
      - "tools/check_canonical_repo_export.py"
      - ".github/workflows/inventory.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validation dependencies
        run: python3 -m pip install pyyaml
      - name: Validate inventory structure
        run: python3 tools/validate_inventory.py
      - name: Check canonical repo estate export
        run: python3 tools/check_canonical_repo_export.py
