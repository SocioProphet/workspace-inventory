name: inventory

# Observable CI probe: canonical repo estate export

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "inventory/**"
      - "exports/**"
      - "tools/validate_inventory.py"
      - "tools/check_canonical_repo_export.py"
      - ".github/workflows/inventory.yml"
  push:
    branches: [main]
    paths:
      - "inventory/**"
      - "exports/**"
      - "tools/validate_inventory.py"
      - "tools/check_canonical_repo_export.py"
      - ".github/workflows/inventory.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install validation dependencies
        run: python3 -m pip install pyyaml
      - name: Validate inventory structure
        run: python3 tools/validate_inventory.py
      - name: Check canonical repo estate export
        run: python3 tools/check_canonical_repo_export.py
