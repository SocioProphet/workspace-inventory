name: canonical-repo-estate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "exports/canonical-repo-estate.v1.0.csv"
      - "exports/canonical-repo-estate.v1.0.json"
      - "tools/validate_canonical_repo_estate.py"
      - ".github/workflows/canonical-repo-estate.yml"
  push:
    branches: [main]
    paths:
      - "exports/canonical-repo-estate.v1.0.csv"
      - "exports/canonical-repo-estate.v1.0.json"
      - "tools/validate_canonical_repo_estate.py"
      - ".github/workflows/canonical-repo-estate.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Validate canonical repo estate export
        run: python3 tools/validate_canonical_repo_estate.py
