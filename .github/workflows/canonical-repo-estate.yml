name: canonical-repo-estate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "exports/canonical-repo-estate.v1.0.csv"
      - "exports/canonical-repo-estate.v1.0.json"
      - "tools/validate_canonical_repo_estate.py"
      - ".github/workflows/canonical-repo-estate.yml"
  push:
    branches: [main]
    paths:
      - "exports/canonical-repo-estate.v1.0.csv"
      - "exports/canonical-repo-estate.v1.0.json"
      - "tools/validate_canonical_repo_estate.py"
      - ".github/workflows/canonical-repo-estate.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Validate canonical repo estate export
        run: python3 tools/validate_canonical_repo_estate.py
