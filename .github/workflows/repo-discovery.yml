name: repo-discovery

# Full-automation root fix: reconcile the live GitHub org against the curated
# inventory. Registration is otherwise fully manual, so this scheduled job is the
# only thing that surfaces org repos absent from repos.yaml + the canonical export.
# On a gap it uploads a report artifact, refreshes the machine-owned backlog
# (inventory/untriaged-repos.yaml), and opens/updates a triage PR. No new secret:
# it reuses GITHUB_TOKEN. Org-read is limited to what that token can see; private
# repos it cannot see are simply not listed (the tool skip-cleans, never fail-reds).

on:
  workflow_dispatch:
  schedule:
    # Daily at 07:17 UTC (off the hour to avoid scheduler congestion).
    - cron: "17 7 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: repo-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TRIAGE_BRANCH: chore/untriaged-org-repos
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install validation dependencies
        run: python3 -m pip install pyyaml

      - name: Discover org repos absent from curated inventory
        id: discover
        run: |
          set -o pipefail
          rc=0
          python3 tools/discover_org_repos.py \
            --json \
            --backlog inventory/untriaged-repos.yaml \
            > discovery-report.json || rc=$?
          echo "rc=${rc}" >> "$GITHUB_OUTPUT"
          if [ "${rc}" = "2" ]; then
            echo "::error::discovery tool usage/structure error"
            exit 2
          fi
          count="$(python3 -c 'import json;print(json.load(open("discovery-report.json"))["untriaged_count"])')"
          echo "untriaged=${count}" >> "$GITHUB_OUTPUT"
          echo "Discovered ${count} un-triaged org repo(s)."

      - name: Upload discovery report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: repo-discovery-report
          path: |
            discovery-report.json
            inventory/untriaged-repos.yaml
          if-no-files-found: warn
          retention-days: 30

      - name: Refresh triage backlog and open/update PR
        if: steps.discover.outputs.rc == '1'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "${TRIAGE_BRANCH}"
          git add inventory/untriaged-repos.yaml
          if git diff --cached --quiet; then
            echo "Backlog unchanged; nothing to push."
            exit 0
          fi
          count="${{ steps.discover.outputs.untriaged }}"
          git commit -m "chore(discovery): refresh untriaged org-repo backlog (${count} repos)"
          git push --force-with-lease origin "${TRIAGE_BRANCH}"
          body="$(printf 'Automated org-vs-inventory reconciliation found **%s** SocioProphet repo(s) present in the GitHub org but absent from the curated inventory (\x60inventory/repos.yaml\x60 + \x60exports/canonical-repo-estate.v1.0.csv\x60 + manifest).\n\nTriage each in \x60inventory/untriaged-repos.yaml\x60:\n- **curate in** — add to \x60inventory/repos.yaml\x60 and, if canonical, the export; or\n- **exclude** — add to \x60inventory/discovery-allowlist.yaml\x60 (or record severance in the manifest).\n\nGenerated by \x60.github/workflows/repo-discovery.yml\x60 via \x60tools/discover_org_repos.py\x60. Machine-owned branch; do not hand-edit the backlog.' "${count}")"
          if [ -n "$(gh pr list --head "${TRIAGE_BRANCH}" --state open --json number --jq '.[0].number' 2>/dev/null)" ]; then
            echo "Open triage PR already exists; branch updated in place."
          else
            gh pr create \
              --base main \
              --head "${TRIAGE_BRANCH}" \
              --title "chore(discovery): ${count} org repo(s) need inventory triage" \
              --body "${body}"
          fi
