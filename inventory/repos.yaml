      - calculus_invariant_character_manuscripts
    estate:
      owner_plane: heller_godel_framework_core
      authority_surface: docs/framework-core/README.md; proof_fabric_kernel/README.md
      doctrine_state: provisional
      validation_state: ci
      adoption_state: partial
      drift_risk: medium
      review_cadence: after Clay-program dependency or framework-core changes
    recovery:
      recovered_threads:
        - Clay proof-fabric kernel alignment
        - boundary geometry / spectral-boundary grammar
        - Heller-Godel calculus-invariant character paper
      disposition: owner_repo_assigned
      authority_artifact: proof_fabric_kernel/docs/ClayProgram_PFK_ConsumerContract_v0.md; docs/framework-core/boundary-spectral-grammar-v0.md; docs/manuscripts/paper_i_deligne_cohomological_phase_characters.md
      tracking_ref: SocioProphet/sociosphere#408; SocioProphet/sociosphere#416
      return_condition: ""
    adoption:
      consumes: []
      consumed_by:
        - Heller-Winters-Theorem
        - yang-mills
        - bsd-proof-program
        - hodge-program-proof
        - hphd-zeta-mirror-lattice
        - np-program
      adoption_state: partial
      compatibility_ref: proof_fabric_kernel/docs/ClayProgram_PFK_ConsumerContract_v0.md
      dependency_pin: consumer repos must pin Heller-Godel commit when claiming PFK compatibility
    validation:
      ci_ref: tests/test_proof_fabric_kernel.py
      local_validator: pytest tests/test_proof_fabric_kernel.py
      release_gate: ""
      known_gap: downstream Clay repos must declare dependency pins and native PFK-compatible receipts before claiming mature adoption
    drift:
      risk: medium
      review_cadence: after Clay-program dependency or framework-core changes
      review_trigger: PFK schema, framework-core, or downstream dependency-pinning changes
      last_reviewed: "2026-05-30"

