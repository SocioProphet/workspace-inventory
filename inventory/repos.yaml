      doctrine_state: provisional
      validation_state: none
      adoption_state: partial
      drift_risk: medium
      review_cadence: after major recovery or doctrine-promotion tranches
    recovery:
      recovered_threads:
        - systems-learning-loops as institutional learning canon
      disposition: owner_repo_assigned
      authority_artifact: docs/institutional-learning-canon-v0.md; kb/topics/institutional-learning.yaml; kb/patterns/institutional-amnesia.md
