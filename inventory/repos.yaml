      return_condition: ""
    adoption:
      consumes:
        - lost work recovery map
      consumed_by:
        - alexandrian-academy
        - prophet-platform
        - sociosphere
      adoption_state: partial
      compatibility_ref: kb/receipts/lost-work-recovery-map.receipt.yaml
      dependency_pin: ""
    validation:
      ci_ref: ""
      local_validator: ""
      release_gate: ""
      known_gap: taxonomy and receipts are document-backed; schemas and validators deferred until pattern set stabilizes
    drift:
      risk: medium
      review_cadence: after major recovery or doctrine-promotion tranches
      review_trigger: lessons recur without receipts or authority artifacts
