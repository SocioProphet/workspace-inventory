workspace_inventory_version: 1
org: socioprophet
repos:
  - name: socioprophet
    kind: monorepo
    manifest: "WORKSPACE.yaml"
    provides:
      - web_portal
      - api
      - mcp_servers
  - name: ontogenesis
    kind: ontology
    manifest: "WORKSPACE.yaml"
    provides:
      - capd:ontogenesis
  - name: prophet-cli
    kind: cli
    manifest: "WORKSPACE.yaml"
    provides:
      - cli:prophet
  - name: sourceos-a2a-mcp-bootstrap
    kind: bootstrap
    manifest: "WORKSPACE.yaml"
    provides:
      - carrier_verify
  - name: human-digital-twin
    kind: service
    manifest: "WORKSPACE.yaml"
    provides:
      - api:hdt
      - opa:policies
      - tritrpc:devine
notes:
  - "Hyperswarm upstream bundles should be tracked as upstream references, not copied."
