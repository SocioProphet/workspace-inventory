workspace_inventory_version: 1
org: SocioProphet
repos:
  - name: socioprophet
    kind: monorepo
    manifest: "WORKSPACE.yaml"
    status: active
    authority_role: public_surface
    boundary_notes: "Customer-facing web/api umbrella and integration workspace, not the canonical standards or execution control plane."
    provides:
      - web_portal
      - api
      - mcp_servers

  - name: workspace-inventory
    kind: tool
    manifest: "WORKSPACE.yaml"
    status: active
    authority_role: repository_index
    boundary_notes: "Canonical ecosystem repo index, estate-ledger authority, and validation entrypoint."
    related_repos:
      - sociosphere
    provides:
      - repo_index
      - inventory_validation
      - estate_ledger
    estate:
      owner_plane: workspace_inventory
      authority_surface: docs/estate-ledger-v0.md
      doctrine_state: draft
      validation_state: local
      adoption_state: partial
      drift_risk: medium
      review_cadence: after major recovery tranches
    recovery:
      recovered_threads:
        - workspace-inventory estate ledger
      disposition: owner_repo_assigned
      authority_artifact: docs/estate-ledger-v0.md
      tracking_ref: SocioProphet/sociosphere#408
      return_condition: ""
    adoption:
      consumes: []
      consumed_by:
        - sociosphere
      adoption_state: partial
      compatibility_ref: docs/estate-ledger-v0.md
      dependency_pin: ""
    validation:
      ci_ref: ""
      local_validator: tools/validate_inventory.py
      release_gate: ""
      known_gap: validator performs minimal structure checks only
    drift:
      risk: medium
      review_cadence: after major recovery tranches
      review_trigger: recovery map, authority roles, or schema fields change
      last_reviewed: "2026-05-30"

  - name: sociosphere
    kind: workspace-controller
    manifest: "WORKSPACE.yaml"
    status: active
    authority_role: workspace_controller
    boundary_notes: "Canonical workspace manifest + lock, runner semantics, deterministic multi-repo materialization, and cross-repo recovery coordination."
    related_repos:
      - workspace-inventory
      - agentplane
      - sourceos-spec
    canonical_source_ref: "sociosphere/governance/CANONICAL_SOURCES.yaml"
    provides:
      - workspace_manifest
      - workspace_lock
      - runner_semantics
      - lost_work_recovery_map
    estate:
      owner_plane: sociosphere
      authority_surface: docs/strategy/lost-work-recovery-map.md
      doctrine_state: provisional
      validation_state: unknown
      adoption_state: partial
      drift_risk: medium
      review_cadence: after each recovery item completion
    recovery:
      recovered_threads:
        - lost work recovery map
      disposition: owner_repo_assigned
      authority_artifact: docs/strategy/lost-work-recovery-map.md
      tracking_ref: SocioProphet/sociosphere#408
      return_condition: ""
    adoption:
      consumes:
        - workspace-inventory estate ledger
      consumed_by:
        - systems-learning-loops
      adoption_state: partial
      compatibility_ref: docs/strategy/lost-work-recovery-map.md
      dependency_pin: ""
    validation:
      ci_ref: ""
      local_validator: ""
      release_gate: ""
      known_gap: recovery map is document-backed and not yet projected from workspace-inventory
    drift:
      risk: medium
      review_cadence: after each recovery item completion
      review_trigger: recovered thread lacks owner repo or authority artifact
      last_reviewed: "2026-05-30"

  - name: agentplane
    kind: execution-plane
    manifest: "WORKSPACE.yaml"
    status: active
    authority_role: execution_control_plane
    boundary_notes: "Bundle validate/place/run/evidence/replay control plane; not canonical schema or substrate authority."
    related_repos:
      - sociosphere
      - sourceos-spec
    canonical_source_ref: "protocol/execution"
    provides:
      - bundle_execution
      - evidence_artifacts
      - replay

  - name: prophet-platform
    kind: component
    manifest: "WORKSPACE.yaml"
    status: active
    authority_role: platform_runtime
    boundary_notes: "Thin runtime/deployment monorepo for platform lanes; normative standards remain upstream."
    related_repos:
      - socioprophet-standards-storage
      - socioprophet-standards-knowledge
    provides:
      - platform_apps
      - contracts
      - telemetry

  - name: prophet-core-catalog
    kind: catalog
    manifest: "WORKSPACE.yaml"
    status: active
    authority_role: provenance_catalog_seed
    boundary_notes: "Auditable provenance-first catalog seed; deeper catalog authority must stay aligned with broader GAIA/catalog ownership."
    related_repos:
      - gaia-world-model
      - socioprophet-standards-storage
    optional_layer: true
    provides:
      - catalog
      - provenance_index

  - name: ontogenesis
    kind: ontology
    manifest: "WORKSPACE.yaml"
    status: active
    authority_role: ontology_authority
    boundary_notes: "Ontology genesis, binding, validation, and semantic substrate; current authority for DoNotLearn/DoNotLink and governed memory representation strata."
    provides:
      - capd:ontogenesis
      - governed_intelligence_semantics
      - privacy_nonlinkability_doctrine
      - memory_representation_strata
    estate:
      owner_plane: ontogenesis
      authority_surface: docs/specs/privacy-nonlinkability-doctrine-v0.md; docs/specs/governed-memory-representation-strata-v0.md
      doctrine_state: provisional
      validation_state: local
      adoption_state: partial
      drift_risk: medium
      review_cadence: after downstream policy/platform adoption
    recovery:
      recovered_threads:
        - DoNotLearn / DoNotLink privacy doctrine
        - governed memory representation strata
      disposition: owner_repo_assigned
      authority_artifact: docs/specs/privacy-nonlinkability-doctrine-v0.md; docs/specs/governed-memory-representation-strata-v0.md
      tracking_ref: SocioProphet/sociosphere#408
      return_condition: ""
    adoption:
      consumes: []
      consumed_by:
        - policy-fabric
        - guardrail-fabric
        - prophet-platform
        - model-governance-ledger
        - agentplane
      adoption_state: planned
      compatibility_ref: catalog/governed_intelligence_registry.ttl
      dependency_pin: ""
    validation:
      ci_ref: ""
      local_validator: make validate
      release_gate: ""
      known_gap: downstream enforcement remains in consuming policy/runtime repos
    drift:
      risk: medium
      review_cadence: after downstream adoption begins
      review_trigger: privacy or memory doctrines gain runtime enforcement or schema changes
      last_reviewed: "2026-05-30"

  - name: socioprophet-standards-storage
    kind: standards
    manifest: "WORKSPACE.yaml"
    status: active
    authority_role: standards_storage
    boundary_notes: "Canonical normative standards package for storage, evidence, and control-plane guidance."
    canonical_source_ref: "standards/storage"
    provides:
      - schemas
      - evidence_contracts
      - control_plane_standards

  - name: socioprophet-standards-knowledge
    kind: standards
    manifest: "WORKSPACE.yaml"
    status: active
    authority_role: knowledge_context_standards
    boundary_notes: "Executable knowledge-context standards, fixtures, verifiers, and transport bindings."
    canonical_source_ref: "standards/knowledge"
    related_repos:
      - tritrpc
      - socioprophet-standards-storage
    provides:
      - knowledge_schemas
      - tritrpc_bindings
      - roundtrip_verifiers

  - name: tritrpc
    kind: protocol
    manifest: "WORKSPACE.yaml"
    status: active
    authority_role: transport_protocol
    boundary_notes: "Canonical deterministic transport/envelope/framing authority."
    canonical_source_ref: "protocol/tritrpc"
    provides:
      - transport
      - fixtures
      - framing

  - name: sourceos-a2a-mcp-bootstrap
    kind: bootstrap
    manifest: "WORKSPACE.yaml"
    status: active
    authority_role: identity_bootstrap
    boundary_notes: "Bootstrap and carrier verification surface for A2A/MCP zero-trust lanes."
    provides:
      - carrier_verify

  - name: human-digital-twin
    kind: service
    manifest: "WORKSPACE.yaml"
    status: active
    authority_role: hdt_consumer
    boundary_notes: "Human digital twin runtime and policy consumer surface."
    provides:
      - api:hdt
      - opa:policies
      - tritrpc:devine

  - name: cloudshell-fog
    kind: operator-surface
    manifest: "WORKSPACE.yaml"
    status: held
    authority_role: hmi_gateway
    boundary_notes: "Operator/HMI gateway surface; treat as client surface while broader dedup/archive decisions remain open."
    optional_layer: true
    related_repos:
      - agentplane
      - prophet-platform
    canonical_source_ref: "dedup/cloudshell"
    provides:
      - cloud_shell
      - operator_gateway

  - name: SourceOS
    org: SociOS-Linux
    kind: os-substrate
    manifest: "WORKSPACE.yaml"
    status: active
    authority_role: immutable_substrate
    boundary_notes: "Immutable local-first OS substrate; substrate rather than builder."
    related_repos:
      - socios
      - workstation-contracts
      - sourceos-spec
    provides:
      - substrate
      - truth_plane

  - name: socios
    org: SociOS-Linux
    kind: automation
    manifest: "WORKSPACE.yaml"
    status: active
    authority_role: automation_commons
    boundary_notes: "Opt-in automation commons for SourceOS; off by default and never a required substrate dependency."
    related_repos:
      - SourceOS
      - workstation-contracts
      - sourceos-spec
      - sociosphere
    optional_layer: true
    provides:
      - ci_cd
      - build_automation
      - catalogs
      - signatures

  - name: workstation-contracts
    org: SociOS-Linux
    kind: contract
    manifest: "WORKSPACE.yaml"
    status: active
    authority_role: workstation_ci_contracts
    boundary_notes: "Stable workstation/CI contract and conformance lane; not the runner or image builder."
    related_repos:
      - SourceOS
      - socios
      - sociosphere
      - sourceos-spec
    provides:
      - lane_contracts
      - conformance

  - name: sourceos-spec
    org: SourceOS-Linux
    kind: typed-contracts
    manifest: "WORKSPACE.yaml"
    status: active
    authority_role: typed_contract_authority
    boundary_notes: "Canonical machine-readable SourceOS/SociOS contract layer, including additive agent-plane and fog-plane families."
    provides:
      - json_schemas
      - openapi_patches
      - asyncapi_patches
      - semantic_overlay

  - name: agent-machine
    org: SourceOS-Linux
    kind: machine-runtime
    manifest: "WORKSPACE.yaml"
    status: active
    authority_role: machine_local_ai_runtime
    boundary_notes: "Canonical machine-local node substrate for runtime probing, inference provider lifecycle, model residency, cache-aware scheduling facts, AgentPod envelopes, and AgentMachineReceipt evidence; not an agent brain or orchestration plane."
    related_repos:
      - sourceos-model-carry
      - agentplane
      - policy-fabric
      - model-router
      - sourceos-devtools
    canonical_source_ref: "sourceos/agent-machine"
    provides:
      - agent_machine
      - agent_pod
      - inference_provider
      - model_residency
      - placement_fact
      - agent_machine_receipt

  - name: TurtleTerm
    org: SourceOS-Linux
    kind: operator-surface
    manifest: "WORKSPACE.yaml"
    status: active
    authority_role: trusted_terminal_workbench
    boundary_notes: "Policy-aware, agent-addressable terminal workbench for trusted command execution, terminal receipts, delegation, and reproducible operator workflows."
