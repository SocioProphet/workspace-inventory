workspace_inventory_version: 1
org: SocioProphet
repos:
  - name: socioprophet
    kind: monorepo
    manifest: "WORKSPACE.yaml"
    status: active
    authority_role: public_surface
    boundary_notes: "Customer-facing web/api umbrella and integration workspace, not the canonical standards or execution control plane."
    provides:
      - web_portal
      - api
      - mcp_servers

  - name: workspace-inventory
    kind: tool
    manifest: "WORKSPACE.yaml"
    status: active
    authority_role: repository_index
    boundary_notes: "Canonical ecosystem repo index and validation entrypoint."
    related_repos:
      - sociosphere
    provides:
      - repo_index
      - inventory_validation

  - name: sociosphere
    kind: workspace-controller
    manifest: "WORKSPACE.yaml"
    status: active
    authority_role: workspace_controller
    boundary_notes: "Canonical workspace manifest + lock, runner semantics, and deterministic multi-repo materialization."
    related_repos:
      - workspace-inventory
      - agentplane
      - sourceos-spec
    canonical_source_ref: "sociosphere/governance/CANONICAL_SOURCES.yaml"
    provides:
      - workspace_manifest
      - workspace_lock
      - runner_semantics

  - name: agentplane
    kind: execution-plane
    manifest: "WORKSPACE.yaml"
    status: active
    authority_role: execution_control_plane
    boundary_notes: "Bundle validate/place/run/evidence/replay control plane; not canonical schema or substrate authority."
    related_repos:
      - sociosphere
      - sourceos-spec
    canonical_source_ref: "protocol/execution"
    provides:
      - bundle_execution
      - evidence_artifacts
      - replay

  - name: prophet-platform
    kind: component
    manifest: "WORKSPACE.yaml"
    status: active
    authority_role: platform_runtime
    boundary_notes: "Thin runtime/deployment monorepo for platform lanes; normative standards remain upstream."
    related_repos:
      - socioprophet-standards-storage
      - socioprophet-standards-knowledge
    provides:
      - platform_apps
      - contracts
      - telemetry

  - name: prophet-core-catalog
    kind: catalog
    manifest: "WORKSPACE.yaml"
    status: active
    authority_role: provenance_catalog_seed
    boundary_notes: "Auditable provenance-first catalog seed; deeper catalog authority must stay aligned with broader GAIA/catalog ownership."
    related_repos:
      - gaia-world-model
      - socioprophet-standards-storage
    optional_layer: true
    provides:
      - catalog
      - provenance_index

  - name: ontogenesis
    kind: ontology
    manifest: "WORKSPACE.yaml"
    status: active
    authority_role: ontology_authority
    boundary_notes: "Ontology genesis, binding, validation, and semantic substrate."
    provides:
      - capd:ontogenesis

  - name: socioprophet-standards-storage
    kind: standards
    manifest: "WORKSPACE.yaml"
    status: active
    authority_role: standards_storage
    boundary_notes: "Canonical normative standards package for storage, evidence, and control-plane guidance."
    canonical_source_ref: "standards/storage"
    provides:
      - schemas
      - evidence_contracts
      - control_plane_standards

  - name: socioprophet-standards-knowledge
    kind: standards
    manifest: "WORKSPACE.yaml"
    status: active
    authority_role: knowledge_context_standards
    boundary_notes: "Executable knowledge-context standards, fixtures, verifiers, and transport bindings."
    canonical_source_ref: "standards/knowledge"
    related_repos:
      - tritrpc
      - socioprophet-standards-storage
    provides:
      - knowledge_schemas
      - tritrpc_bindings
      - roundtrip_verifiers

  - name: tritrpc
    kind: protocol
    manifest: "WORKSPACE.yaml"
    status: active
    authority_role: transport_protocol
    boundary_notes: "Canonical deterministic transport/envelope/framing authority."
    canonical_source_ref: "protocol/tritrpc"
    provides:
      - transport
      - fixtures
      - framing

  - name: sourceos-a2a-mcp-bootstrap
    kind: bootstrap
    manifest: "WORKSPACE.yaml"
    status: active
    authority_role: identity_bootstrap
    boundary_notes: "Bootstrap and carrier verification surface for A2A/MCP zero-trust lanes."
    provides:
      - carrier_verify

  - name: human-digital-twin
    kind: service
    manifest: "WORKSPACE.yaml"
    status: active
    authority_role: hdt_consumer
    boundary_notes: "Human digital twin runtime and policy consumer surface."
    provides:
      - api:hdt
      - opa:policies
      - tritrpc:devine

  - name: cloudshell-fog
    kind: operator-surface
    manifest: "WORKSPACE.yaml"
    status: held
    authority_role: hmi_gateway
    boundary_notes: "Operator/HMI gateway surface; treat as client surface while broader dedup/archive decisions remain open."
    optional_layer: true
    related_repos:
      - agentplane
      - prophet-platform
    canonical_source_ref: "dedup/cloudshell"
    provides:
      - cloud_shell
      - operator_gateway

  - name: SourceOS
    org: SociOS-Linux
    kind: os-substrate
    manifest: "WORKSPACE.yaml"
    status: active
    authority_role: immutable_substrate
    boundary_notes: "Immutable local-first OS substrate; substrate rather than builder."
    related_repos:
      - socios
      - workstation-contracts
      - sourceos-spec
    provides:
      - substrate
      - truth_plane

  - name: socios
    org: SociOS-Linux
    kind: automation
    manifest: "WORKSPACE.yaml"
    status: active
    authority_role: automation_commons
    boundary_notes: "Opt-in automation commons for SourceOS; off by default and never a required substrate dependency."
    related_repos:
      - SourceOS
      - workstation-contracts
      - sourceos-spec
      - sociosphere
    optional_layer: true
    provides:
      - ci_cd
      - build_automation
      - catalogs
      - signatures

  - name: workstation-contracts
    org: SociOS-Linux
    kind: contract
    manifest: "WORKSPACE.yaml"
    status: active
    authority_role: workstation_ci_contracts
    boundary_notes: "Stable workstation/CI contract and conformance lane; not the runner or image builder."
    related_repos:
      - SourceOS
      - socios
      - sociosphere
      - sourceos-spec
    provides:
      - lane_contracts
      - conformance

  - name: sourceos-spec
    org: SourceOS-Linux
    kind: typed-contracts
    manifest: "WORKSPACE.yaml"
    status: active
    authority_role: typed_contract_authority
    boundary_notes: "Canonical machine-readable SourceOS/SociOS contract layer, including additive agent-plane and fog-plane families."
    provides:
      - json_schemas
      - openapi_patches
      - asyncapi_patches
      - semantic_overlay

  - name: agent-machine
    org: SourceOS-Linux
    kind: machine-runtime
    manifest: "WORKSPACE.yaml"
    status: active
    authority_role: machine_local_ai_runtime
    boundary_notes: "Canonical machine-local node substrate for runtime probing, inference provider lifecycle, model residency, cache-aware scheduling facts, AgentPod envelopes, and AgentMachineReceipt evidence; not an agent brain or orchestration plane."
    related_repos:
      - sourceos-model-carry
      - agentplane
      - policy-fabric
      - model-router
      - sourceos-devtools
    canonical_source_ref: "sourceos/agent-machine"
    provides:
      - agent_machine
      - agent_pod
      - inference_provider
      - model_residency
      - placement_fact
      - agent_machine_receipt

  - name: TurtleTerm
    org: SourceOS-Linux
    kind: operator-surface
    manifest: "WORKSPACE.yaml"
    status: active
    authority_role: trusted_terminal_workbench
    boundary_notes: "Policy-aware, agent-addressable terminal workbench for trusted command execution, terminal receipts, delegation, and reproducible operator workflows."
    related_repos:
      - agent-term
      - sourceos-devtools
      - agent-machine
      - agentplane
      - policy-fabric
    canonical_source_ref: "sourceos/operator/turtleterm"
    provides:
      - trusted_terminal
      - terminal_receipts
      - agent_gateway
      - skill_manifests

  - name: BearBrowser
    org: SourceOS-Linux
    kind: browser-runtime
    manifest: "WORKSPACE.yaml"
    status: active
    authority_role: governed_browser_runtime
    boundary_notes: "LibreWolf-derived SourceOS browser product for human secure browsing and governed browser-agent execution; product overlays live here while upstream source mirroring stays clean."
    related_repos:
      - librewolf-source-mirror
      - browser-use
      - agentplane
      - policy-fabric
      - sourceos-shell
    canonical_source_ref: "sourceos/browser/bearbrowser"
    provides:
      - human_secure_browser
      - agent_browser_runtime
      - browser_policy_profiles
      - browser_automation_surface

  - name: agent-term
    org: SourceOS-Linux
    kind: chatops-console
    manifest: "WORKSPACE.yaml"
    status: active
    authority_role: terminal_native_operator_console
    boundary_notes: "Matrix-first terminal-native ChatOps console and event log for human operators, agents, GitHub, CI, MCP tools, Policy Fabric, AgentPlane, Sociosphere, and SourceOS services."
    related_repos:
      - agent-registry
      - sociosphere
      - policy-fabric
      - agentplane
      - memory-mesh-upstream
      - sherlock-search
      - holmes
    canonical_source_ref: "sourceos/operator/agent-term"
    provides:
      - matrix_chatops
      - operator_event_log
      - approval_threads
      - agent_participant_registry

  - name: sourceos-devtools
    org: SourceOS-Linux
    kind: developer-operator-toolkit
    manifest: "WORKSPACE.yaml"
    status: active
    authority_role: sourceosctl_operator_cli
    boundary_notes: "Installable SourceOS developer/operator CLI surface; read-only and dry-run by default, with local mutation requiring explicit --execute --policy-ok and evidence emission."
    related_repos:
      - sourceos-spec
      - sourceos-model-carry
      - agent-machine
      - TurtleTerm
      - BearBrowser
      - model-router
      - guardrail-fabric
    canonical_source_ref: "sourceos/operator/sourceosctl"
    provides:
      - sourceosctl
      - dry_run_plans
      - evidence_inspection
      - guarded_local_execution

  - name: sourceos-model-carry
    org: SourceOS-Linux
    kind: model-carry
    manifest: "WORKSPACE.yaml"
    status: active
    authority_role: on_device_ai_service_carry
    boundary_notes: "On-device carriage layer for governed AI service clients, launch profiles, signed model references, cache policy, fallback references, ReleaseSet and BootReleaseSet bindings, and evidence collectors."
    related_repos:
      - model-router
      - model-governance-ledger
      - guardrail-fabric
      - sourceos-spec
      - sourceos-boot
      - agent-machine
    canonical_source_ref: "sourceos/model-carry"
    provides:
      - signed_model_refs
      - local_model_profiles
      - model_cache_policy
      - boot_release_bindings

  - name: homebrew-tap
    org: SourceOS-Linux
    kind: distribution
    manifest: "WORKSPACE.yaml"
    status: active
    authority_role: sourceos_homebrew_distribution
    boundary_notes: "SourceOS Homebrew tap for first-class install surfaces such as TurtleTerm, BearBrowser, Agent Machine, and SourceOS developer tools."
    related_repos:
      - TurtleTerm
      - BearBrowser
      - agent-machine
      - sourceos-devtools
    canonical_source_ref: "sourceos/distribution/homebrew"
    provides:
      - homebrew_formulae
      - install_surface

  - name: librewolf-source-mirror
    org: SourceOS-Linux
    kind: upstream-mirror
    manifest: "WORKSPACE.yaml"
    status: active
    authority_role: browser_upstream_mirror
    boundary_notes: "Clean LibreWolf source mirror. SourceOS product behavior, profiles, policy overlays, and agent runtime contracts must remain in BearBrowser."
    related_repos:
      - BearBrowser
    optional_layer: true
    canonical_source_ref: "sourceos/browser/upstream-mirror"
    provides:
      - upstream_browser_source
      - browser_build_reference

  - name: HolographMe
    kind: human-digital-twin
    manifest: "WORKSPACE.yaml"
    status: active
    authority_role: self_owned_human_twin_governance
    boundary_notes: "Self-owned human digital twin governance layer for capability, reputation, preferences, credentials, work proofs, consent-scoped projections, and delegated agent permissions."
    related_repos:
      - human-digital-twin
      - agent-registry
      - policy-fabric
      - model-governance-ledger
      - alexandrian-academy
    canonical_source_ref: "holographme/human-twin-governance"
    provides:
      - human_twin_governance
      - consent_policy
      - capability_graph
      - mission_fit_projection

  - name: smart-tree
    kind: inspection-tool
    manifest: "WORKSPACE.yaml"
    status: candidate
    authority_role: ai_friendly_repo_tree_inspection
    boundary_notes: "Fast AI-friendly directory visualization, security scanning, compression, MCP, and memory/context tooling. Treat as candidate/semi-trusted until supply-chain, MCP hook, and memory behaviors pass governance review."
    related_repos:
      - workspace-inventory
      - sociosphere
      - guardrail-fabric
      - sourceos-devtools
    optional_layer: true
    canonical_source_ref: "candidate/tools/smart-tree"
    provides:
      - repo_tree_inspection
      - mcp_tooling
      - security_scan
      - context_compression

notes:
  - "Hyperswarm upstream bundles should be tracked as upstream references, not copied."
  - "Cross-org authorities are included when they are canonical to the same SourceOS/SociOS effort."
  - "Prophet Intelligence Foundry is a first-class program plane and should be represented by a dedicated canonical repository or explicitly housed under prophet-platform-fabric-mlops-ts-suite until promoted."
  - "Recent SourceOS operator/runtime repos are first-class active surfaces, not demos: agent-machine, TurtleTerm, BearBrowser, agent-term, sourceos-devtools, homebrew-tap, and librewolf-source-mirror."
  - "smart-tree is useful but remains candidate/semi-trusted until its MCP, hook, and memory surfaces are audited under guardrail-fabric and policy-fabric."
